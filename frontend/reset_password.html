<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password - Campus Coin</title>
    <style>
        * { box-sizing: border-box; }
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f4f8f6;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
        }
        .box {
            width: min(420px, 92%);
            background: #fff;
            padding: 30px;
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0,0,0,.08);
        }
        h2 { margin-top: 0; color: #123d34; }
        p { color: #66736f; }
        label { display: block; margin: 18px 0 7px; font-weight: 600; }
        input {
            width: 100%;
            padding: 12px;
            border: 1px solid #d6dfdb;
            border-radius: 10px;
            outline: none;
        }
        button {
            width: 100%;
            margin-top: 22px;
            padding: 12px;
            border: 0;
            border-radius: 10px;
            background: #138a5a;
            color: #fff;
            font-weight: 700;
            cursor: pointer;
        }
        #message { margin-top: 16px; font-size: 14px; }
    </style>
</head>
<body>
    <div class="box">
        <h2>Reset your password</h2>
        <p>Enter a new password for your Campus Coin account.</p>

        <form id="resetForm">
            <label for="password">New Password</label>
            <input id="password" type="password" minlength="8" required>

            <label for="confirmPassword">Confirm Password</label>
            <input id="confirmPassword" type="password" minlength="8" required>

            <button type="submit">Update Password</button>
        </form>

        <div id="message"></div>
    </div>

    <script>
        const params = new URLSearchParams(window.location.search);
        const token = params.get("token");
        const message = document.getElementById("message");

        document.getElementById("resetForm").addEventListener("submit", async function (e) {
            e.preventDefault();

            const password = document.getElementById("password").value;
            const confirmPassword = document.getElementById("confirmPassword").value;

            if (!token) {
                message.textContent = "Reset token is missing.";
                return;
            }

            if (password !== confirmPassword) {
                message.textContent = "Passwords do not match.";
                return;
            }

            try {
                const response = await fetch("../backend/auth/reset_password.php", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ token: token, password: password })
                });

                const data = await response.json();
                message.textContent = data.message;

                if (data.success) {
                    document.getElementById("resetForm").reset();
                }
            } catch (error) {
                message.textContent = "Something went wrong. Please try again.";
            }
        });
    </script>
</body>
</html>
